<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XZM Custom | Tienda de Estilos</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">XZM CUSTOM</div>
        <div class="nav-links">
            <span id="statusDot" style="color: #27c93f;">● Online</span>
        </div>
    </nav>

    <div class="container">
        <section class="search-section">
            <h1>Personaliza tu Identidad</h1>
            <p>Conecta tu cuenta de Discord para acceder a la tienda de estilos exclusivos.</p>
            <div class="search-box">
                <input type="text" id="userId" placeholder="Ingresa tu Discord ID">
                <button class="btn-primary" id="searchBtn">Sincronizar</button>
            </div>
        </section>

        <main id="mainContent" style="display: none;">
            <div class="profile-preview">
                <div class="avatar-wrap">
                    <img src="" id="userAvatar" class="avatar" alt="Avatar">
                </div>
                <div class="info">
                    <span class="badge-level">Nivel <span id="userLevel">0</span></span>
                    <h2 id="userName">Cargando...</h2>
                    <span class="tag" id="userTag">@usuario</span>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <span class="stat-label">XP Disponible</span>
                            <span class="stat-value" id="userXP">0</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">Rango Global</span>
                            <span class="stat-value">#--</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="shop-section">
                <h2 style="margin-bottom: 30px; font-size: 2rem;">🛍️ Tienda de Personalización</h2>
                <div class="shop-grid">
                    <div class="shop-card">
                        <img src="https://cdn-icons-png.flaticon.com/512/1164/1164620.png" alt="Contorno">
                        <div class="item-name">Contorno Neón</div>
                        <span class="item-price">500 XP</span>
                        <button class="btn-buy" onclick="buyItem('neon', 500, 'contour')">Canjear</button>
                    </div>
                    <div class="shop-card">
                        <img src="https://cdn-icons-png.flaticon.com/512/1043/1043445.png" alt="Fondo">
                        <div class="item-name">Panel Windows</div>
                        <span class="item-price">1,500 XP</span>
                        <button class="btn-buy" onclick="buyItem('windows', 1500, 'theme')">Canjear</button>
                    </div>
                    <div class="shop-card">
                        <img src="https://cdn-icons-png.flaticon.com/512/2906/2906206.png" alt="Acento">
                        <div class="item-name">Contorno Dorado</div>
                        <span class="item-price">2,000 XP</span>
                        <button class="btn-buy" onclick="buyItem('gold', 2000, 'contour')">Canjear</button>
                    </div>
                </div>
            </div>
            </main>
            </div>

            <script type="module">
            import { init } from './js/ui.js';
            import { purchaseItem } from './js/api.js';

            window.buyItem = async (itemId, price, type) => {
            const userId = localStorage.getItem('xzm_user_id');
            if(!userId) return alert("Primero sincroniza tu perfil");

            if(!confirm(`¿Deseas canjear "${itemId}" por ${price} XP?`)) return;

            try {
                const data = await purchaseItem(userId, itemId, price, type);
                if(data.error) throw new Error(data.error);

                alert("¡Compra realizada con éxito! Tu perfil ha sido actualizado.");
                location.reload(); // Recargar para ver el nuevo XP y estilos
            } catch (err) {
                alert("Error: " + err.message);
            }
            };

            init();
            </script>
            </body>
</html>
