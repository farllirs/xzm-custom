<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XZM Store</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-window">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-dot"></div>
                <span class="brand-name">XZM Store</span>
            </div>

            <nav class="nav-links">
                <button class="nav-item active">🛒 Tienda</button>
                <button class="nav-item">👤 Perfil</button>
                <button class="nav-item">⚙️ Ajustes</button>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main">
            <header>
                <h1>Personalización</h1>
                <div class="sync-box">
                    <input type="text" id="userId" placeholder="ID o Token..." autocomplete="off">
                    <button class="btn-sync" id="searchBtn">Sincronizar</button>
                </div>
            </header>

            <div id="mainContent" style="display: none;">
                <!-- USER SECTION -->
                <section class="profile-section">
                    <div class="profile-card">
                        <img src="" id="userAvatar" class="avatar" alt="Avatar">
                        <div class="user-info">
                            <h2 id="userName">Cargando...</h2>
                            <p class="user-tag" id="userTag">@usuario</p>
                            <div class="stats">
                                <div class="stat-item">
                                    <span class="label">Nivel</span>
                                    <span class="value" id="userLevel">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="label">XP</span>
                                    <span class="value" id="userXP">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- SHOP SECTION -->
                <section class="shop-grid">
                    <div class="item-card">
                        <img src="https://cdn-icons-png.flaticon.com/512/1164/1164620.png" class="item-icon">
                        <div class="item-name">Windows Classic</div>
                        <span class="rarity">Common</span>
                        <span class="item-price">2,500 XP</span>
                        <button class="btn-buy" onclick="buyItem('windows', 'themes')">Canjear</button>
                    </div>

                    <div class="item-card">
                        <img src="https://cdn-icons-png.flaticon.com/512/1043/1043445.png" class="item-icon">
                        <div class="item-name">Neon Glow</div>
                        <span class="rarity">Rare</span>
                        <span class="item-price">5,000 XP</span>
                        <button class="btn-buy" onclick="buyItem('neon', 'contours')">Canjear</button>
                    </div>

                    <div class="item-card">
                        <img src="https://cdn-icons-png.flaticon.com/512/2906/2906206.png" class="item-icon">
                        <div class="item-name">Gold Plated</div>
                        <span class="rarity">Executive</span>
                        <span class="item-price">15,000 XP</span>
                        <button class="btn-buy" onclick="buyItem('gold', 'contours')">Canjear</button>
                    </div>

                    <div class="item-card">
                        <img src="https://cdn-icons-png.flaticon.com/512/1458/1458567.png" class="item-icon">
                        <div class="item-name">RGB Chroma</div>
                        <span class="rarity">Exclusive</span>
                        <span class="item-price">50,000 XP</span>
                        <button class="btn-buy" onclick="buyItem('chroma', 'contours')">Canjear</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script type="module">
        import { init } from './js/ui.js';
        import { purchaseItem } from './js/api.js';

        window.buyItem = async (itemId, category) => {
            const userId = localStorage.getItem('xzm_user_id');
            if (!userId) return alert("Sincroniza tu perfil primero.");

            if (!confirm(`¿Confirmas el canje de este item?`)) return;

            try {
                const data = await purchaseItem(userId, itemId, category);
                if (data.error) throw new Error(data.error);
                alert("¡Éxito! Estilo añadido a tu inventario.");
                location.reload();
            } catch (err) {
                alert("Error: " + err.message);
            }
        };

        init();
    </script>
</body>
</html>
